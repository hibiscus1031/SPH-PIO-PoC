runtime_policy:
  independent_subprocess_per_trajectory: true
  python_default_cyclic_gc_enabled: true
  forward_under_torch_no_grad: true
  inloop_gc_collect_prohibited: true
  cyclic_gc_disable_prohibited: true
  parent_receives_tensor_state_neighborhood_or_force_result: false
  parent_receives_scalar_summary_and_relative_paths_only: true
  child_exits_after_trajectory: true
  ad_uses_separate_short_process: true
  checkpoint_tensor_history_only: true
  retired_object_count_is_hard_gate: false
  rerun_r2_to_r5_resource_toolchain: false

physics:
  domain_minimum: [-1.0, -1.0]
  domain_maximum: [1.0, 1.0]
  periodic: [true, true]
  reference_density: 1.0
  velocity_amplitude: 1.0
  domain_length: 2.0
  physical_viscosity: 0.02
  reynolds_number: 100.0
  sound_speed_primary: 20.0
  nominal_mach_primary: 0.05
  final_time_primary: 0.2
  dtype: "float64"
  device: "cpu"
  initial_velocity_x: "-U0*sin(pi*x)*cos(pi*y)"
  initial_velocity_y: " U0*cos(pi*x)*sin(pi*y)"
  exact_velocity_decay: "exp(-2*nu*pi^2*t)"
  exact_kinetic_energy_decay: "exp(-4*nu*pi^2*t)"
  density: "kernel summation at every complete force stage"
  eos: "p_i = c_s^2*(rho_i-rho0)"
  pressure: "Stage 01C structure-preserving conservative pair force"
  viscosity: "Stage 01C symmetric dissipative pair force"
  integrator: "explicit midpoint RK2"
  topology: "rebuilt reciprocal duplicate-free periodic neighborhood at every force stage"
  prohibited_features:
    background_pressure: true
    pressure_clipping: true
    artificial_viscosity: true
    particle_shifting: true
    density_diffusion: true
    turbulence_model: true

sampling:
  common_physical_times: 21
  include_initial_and_final: true
  saved_state_fields: ["positions", "velocities"]
  save_density_pressure_history: false
  scalar_diagnostics_every_checkpoint: true

resource_gates:
  current_rss_limit_bytes: 2000000000
  peak_rss_limit_bytes: 4000000000
  quartile_rss_increase_limit_bytes: 250000000
  quartile_rss_relative_increase_limit: 0.50
  step_time_quartile_ratio_limit: 1.30
  minimum_system_available_memory_fraction: 0.05
  maximum_parent_rss_growth_bytes: 64000000
  child_reclamation_required: true

dynamic_gates:
  maximum_relative_pair_force_residual: 1.0e-12
  maximum_normalized_internal_force_residual: 1.0e-10
  viscous_power_positive_absolute_tolerance: 1.0e-12
  minimum_separation_over_dx: 0.25
  topology_defect_count_required: 0

prerequisites:
