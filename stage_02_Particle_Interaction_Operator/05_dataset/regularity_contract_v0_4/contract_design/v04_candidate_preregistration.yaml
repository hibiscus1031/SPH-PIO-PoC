  MAGNITUDE_ONLY_SMOOTH:
    field: q0_times_1_plus_0p4_cos_2pi_x_times_unit_x
    expectation: p_mag_significant_p_dir_not_required_p_any_PASS
  DIRECTION_ONLY_SMOOTH:
    field: q0_times_cos_2pi_x_sin_2pi_x
    expectation: p_dir_significant_p_mag_not_required_p_any_PASS
  JOINT_SMOOTH:
    field: q0_times_1_plus_0p3_cos_2pi_x_times_cos_2pi_y_sin_2pi_y
