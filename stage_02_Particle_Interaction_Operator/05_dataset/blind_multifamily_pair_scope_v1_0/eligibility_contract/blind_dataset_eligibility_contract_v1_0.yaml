contract_id: blind_dataset_eligibility_contract_v1_0
contract_version: stage02jw-blind-dataset-eligibility-1.0.0
frozen_before_blind_formula_materialization: true
regularity_policy:
  regularity_hard_gate_permitted: false
  regularity_diagnostic_only: true
  eligibility_effect: none
  v0_5_or_new_smoothness_gate_permitted: false
  historical_v0_1_through_v0_4_results_retained: true
blind_identities:
  - {family_id: BLIND_FAMILY_01, root_seed: 2026080401, role: future_train}
  - {family_id: BLIND_FAMILY_02, root_seed: 2026080402, role: future_train}
  - {family_id: BLIND_FAMILY_03, root_seed: 2026080403, role: future_validation}
  - {family_id: BLIND_FAMILY_04, root_seed: 2026080404, role: future_test}
family_selection:
  replacement_permitted: false
  seed_redraw_permitted: false
  formula_rejection_after_observation_permitted: false
  all_or_none_case_count: 5
case_matrix:
  resolution:
    - {case_suffix: n12_h26, particles_per_axis: 12, h_over_dx: 2.6}
    - {case_suffix: n16_h26, particles_per_axis: 16, h_over_dx: 2.6}
    - {case_suffix: n20_h26, particles_per_axis: 20, h_over_dx: 2.6}
  support_extension:
    - {case_suffix: n16_h22, particles_per_axis: 16, h_over_dx: 2.2}
    - {case_suffix: n16_h30, particles_per_axis: 16, h_over_dx: 3.0}
reference_gate:
  threshold_source: stage_02_Particle_Interaction_Operator/04_target_attribution/acceptance/reference_acceptance_rules.yaml
  required:
    - same_state
    - same_physics
    - Fourier_reference_accepted
    - analytic_reference_accepted
    - Fourier_analytic_pair_agreement
    - deterministic_repeat
    - qualified_uncertainty
target_core_gate:
  target: delta_a_equals_a_FOURIER_minus_a_SPH
  sign: a_reference_minus_a_sph
  required:
    - nonzero_target
    - target_identity
    - topology
    - reference_pair_qualified
    - state_configuration_graph_hash_alignment
resolution_gate:
  source: stage02i_frozen_non_regularity_rules
  required:
    - target_endpoint_magnitude_nonincreasing
    - adjacent_low_mode_direction_cosine
    - relative_neighbor_variation_strictly_decreasing
    - physical_gradient_scale_coefficient_of_variation
  regularity_statistic_permitted: false
  convergence_order_claim_permitted: false
support_gate:
  source: stage02f_stage02i_frozen_support_rules
  required:
    - bounded_magnitude_variation
    - adjacent_direction_consistency
    - active_neighbor_accounting
    - zero_weight_exterior_edge_retention
    - topology
    - reference_agreement
temporal_gate:
  evaluation_time: 0.0
  trajectory: none
  temporal_derivative: none
  DOP853: none
  future_state: none
model_form_gate:
  allowed_status: PASS_WITHIN_FROZEN_SPATIAL_OPERATOR_SCOPE
  full_PDE_confirmation_permitted: false
  Stage01_V2_restoration_permitted: false
  viscosity_operator_confirmation_permitted: false
conservation_gate:
  normalized_total_target_force_residual_max: 1.0e-10
  general_antisymmetric_incidence_projection_residual_max: 1.0e-10
  central_pair_and_torque_role: diagnostic_only
  target_mean_subtraction_permitted: false
  projection_writeback_permitted: false
  node_or_hybrid_head_permitted: false
record_contract:
  core_schema: stage02b_pio_dataset_schema
  extension_schema: stage02j_graph_record_schema
  supervision: node_level_delta_a_and_nodal_force
  edge_pair_label_permitted: false
  canonical_serializer: stage02j_SPHPIOJ1
  float_dtype: big_endian_float64
  integer_dtype: big_endian_int64
  particle_order: lexicographic_periodic_position_then_original_id
  edge_order: source_target_pair_id
  deterministic_checks: [double_serialization,decode_reencode,byte_SHA256]
family_qualification:
  required_case_pass_count: 5
  required_case_count: 5
  partial_family_materialization_permitted: false
leakage_and_split:
  expected_disconnected_family_components: 4
  family_level_only: true
  train: [BLIND_FAMILY_01,BLIND_FAMILY_02]
  validation: [BLIND_FAMILY_03]
  test: [BLIND_FAMILY_04]
  particle_edge_patch_split_permitted: false
normalization:
  prerequisite: all_20_records_and_leakage_and_split_PASS
  fitting_population: ten_future_train_full_graphs
  weighting: graph_balanced
  validation_or_test_use_permitted: false
  target_reference_or_target_derived_use_permitted: false
eligibility:
  required_checks:
    - frozen_blind_identity
    - physical_preflight
    - reference_pair_accepted
    - target_attribution_core
    - pair_only_conservation
    - schema
    - canonical_serialization
    - provenance
    - uncertainty
    - topology
    - determinism
    - family_assignment
    - leakage
    - prefrozen_split
    - train_only_normalization_contract
  required_pass_count: 15
  regularity_in_gate: false
  manual_override_permitted: false
historical_isolation:
  Stage02J_PV: development_audit_only
  Stage02JR_families: historical_nonblind_diagnostic_only
  Stage02J_jitter: distribution_shift_diagnostic_only
  Stage01_R3_shear_acoustic: independent_validation_only

